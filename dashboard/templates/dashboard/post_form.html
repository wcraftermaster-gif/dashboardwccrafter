{% extends "base.html" %}
{% block title %}{% if object %}Editar{% else %}Nuevo{% endif %} post{% endblock %}
{% block content %}
    <h1>{% if object %}Editar{% else %}Nuevo{% endif %} post</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
