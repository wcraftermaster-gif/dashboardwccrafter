{% extends "base.html" %}
{% block title %}Eliminar post{% endblock %}
{% block content %}
    <h1>¿Eliminar "{{ object.title }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'dashboard:post_list' %}">Cancelar</a>
    </form>
{% endblock %}
