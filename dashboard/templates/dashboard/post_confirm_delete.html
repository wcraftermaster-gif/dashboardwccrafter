{% extends "dashboard/base_dashboard.html" %}
{% block title %}Eliminar post{% endblock %}
{% block page_title %}Eliminar post{% endblock %}

{% block content %}
<div class="bg-surface-white rounded-lg shadow-sm p-8 max-w-lg">
    <p class="text-dark">¿Seguro que quieres eliminar <strong>"{{ object.title }}"</strong>? Esta acción no se puede deshacer.</p>
    <form method="post" class="flex gap-3 mt-6">
        {% csrf_token %}
        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors">
            Sí, eliminar
        </button>
        <a href="{% url 'dashboard:post_list' %}" class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
