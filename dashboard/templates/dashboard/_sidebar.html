{% load static %}
<aside id="sidebar" class="sticky top-0 h-screen bg-dark shadow-brand flex flex-col shrink-0 transition-all duration-250 w-45">

    <div class="flex items-center gap-2 h-16 px-2 border-b border-white/10 overflow-hidden">
       <img id="sidebar-logo" src="{% static 'img/favicon.png' %}" alt="Crafter" class="w-11 h-11 shrink-0 transition-all duration-200">
        <span class="sidebar-label text-white font-bold text-xl whitespace-nowrap">Crafter</span>
    </div>

    <nav class="flex-1 px-2 py-1 space-y-1 overflow-y-auto overflow-x-hidden">

        <a href="{% url 'dashboard:home' %}"
        class="flex items-center gap-3 px-1.5 py-1 rounded-sm text-sm font-medium transition-colors
          text-gray-300 hover:bg-dark-700 hover:text-white
          {% if request.resolver_match.url_name == 'home' %}bg-dark-700 text-white{% endif %}">
            <svg class="w-3.5 h-3.5 shrink-0 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>
            </svg>
            <span class="sidebar-label whitespace-nowrap">Inicio</span>
        </a>

        <div>


            <div class="flex items-center rounded-sm text-gray-300 hover:bg-dark-700 hover:text-white
            {% if 'post' in request.resolver_match.url_name or 'category' in request.resolver_match.url_name or 'tag' in request.resolver_match.url_name %}bg-dark-700 text-white{% endif %}">
    <a href="{% url 'dashboard:post_list' %}" class="flex items-center gap-3 px-1.5 py-1 flex-1 text-sm font-medium">
        <svg class="w-3.5 h-3.5 shrink-0 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span class="sidebar-label whitespace-nowrap">Blog</span>
    </a>
    <button type="button" id="blog-menu-toggle" class="px-1.5 py-1">
        <svg id="blog-menu-chevron" class="w-3.5 h-3.5 shrink-0 sidebar-label transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
        </svg>
    </button>
</div>

            <div id="blog-submenu" class="mt-1 ml-4 border-l border-white/10 space-y-1">

                <a href="{% url 'dashboard:post_create' %}"
                   class="flex items-center gap-1 px-1.5 py-1 rounded-sm text-xs transition-colors
                          {% if request.resolver_match.url_name == 'post_create' %}text-brand-500{% else %}text-gray-400 hover:text-white{% endif %}">
                    <svg class="w-3.5 h-3.5 shrink-0 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>
                    </svg>
                    <span class="sidebar-label whitespace-nowrap">Nueva publicación</span>
                </a>

                <a href="{% url 'dashboard:post_list' %}"
                   class="flex items-center gap-1 px-1.5 py-1 rounded-sm text-xs transition-colors
                          {% if request.resolver_match.url_name == 'post_list' or request.resolver_match.url_name == 'post_edit' %}text-brand-500{% else %}text-gray-400 hover:text-white{% endif %}">
                    <svg class="w-3.5 h-3.5 shrink-0 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                    </svg>
                    <span class="sidebar-label whitespace-nowrap">Todas las publicaciones</span>
                </a>

                <a href="{% url 'dashboard:category_list' %}"
                   class="flex items-center gap-1 px-1.5 py-1 rounded-sm text-xs transition-colors
                          {% if 'category' in request.resolver_match.url_name %}text-brand-500{% else %}text-gray-400 hover:text-white{% endif %}">
                    <svg class="w-3.5 h-3.5 shrink-0 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                    <span class="sidebar-label whitespace-nowrap">Categorías</span>
                </a>

                <a href="{% url 'dashboard:tag_list' %}"
                   class="flex items-center gap-1 px-1.5 py-1 rounded-sm text-xs transition-colors
                          {% if 'tag' in request.resolver_match.url_name %}text-brand-500{% else %}text-gray-400 hover:text-white{% endif %}">
                    <svg class="w-3.5 h-3.5 shrink-0 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.59 13.41 13.41 20.6a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/>
                    </svg>
                    <span class="sidebar-label whitespace-nowrap">Etiquetas</span>
                </a>
            </div>
        </div>

    </nav>

    <div class="p-2 border-t border-white/10 space-y-1">
        <button type="button" id="sidebar-collapse-toggle"
        class="w-full flex items-center gap-1 px-1.5 py-1 rounded-sm text-sm text-gray-300 hover:bg-dark-700 hover:text-white transition-colors">
            <svg id="collapse-icon" class="w-3.5 h-3.5 shrink-0 text-brand-500 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
            </svg>
            <span class="sidebar-label whitespace-nowrap">Colapsar</span>
        </button>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center gap-1 px-1.5 py-1 rounded-sm text-sm text-gray-300 hover:bg-dark-700 hover:text-white transition-colors">
                <svg class="w-3.5 h-3.5 shrink-0 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
                </svg>
                <span class="sidebar-label whitespace-nowrap">Cerrar sesión</span>
            </button>
        </form>
    </div>
</aside>
