{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} · Mi Sitio</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bg-surface">
    <div class="flex min-h-screen">
        {% include "dashboard/_sidebar.html" %}

        <div class="flex-1 min-w-0 flex flex-col">
            <header class="bg-surface-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-dark">{% block page_title %}{% endblock %}</h1>
                <span class="text-sm text-gray-500">{{ request.user.username }}</span>
            </header>

            <main class="p-8">
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 px-4 py-3 rounded-lg bg-brand-50 text-brand-700 text-sm">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
