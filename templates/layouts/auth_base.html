{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Acceso{% endblock %} · Mi Sitio</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bg-dark min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <span class="text-brand-500 font-bold text-2xl">Mi Sitio</span>
        </div>

        <div class="bg-surface-white rounded-xl shadow-brand p-8">
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 px-4 py-3 rounded-lg bg-brand-50 text-brand-700 text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
